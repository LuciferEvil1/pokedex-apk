name: Build Pokédex APK

# Builds the installable Android APK on GitHub's servers — no Android Studio needed.
# Runs automatically on every push to main, or manually from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web code into the Android project
        run: npx cap sync android

      - name: Install persistent debug keystore
        run: |
          mkdir -p ~/.android
          keytool -importkeystore -srckeystore android/debug.p12 -srcstoretype pkcs12 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststorepass android -destkeypass android -alias androiddebugkey -noprompt

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
